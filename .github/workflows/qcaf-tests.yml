name: QCAF notebook bridge tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run QCAF bridge tests
        run: pytest -q tests/test_qcaf_notebook.py
